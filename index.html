function enemyImageKey(name){
 const n=String(name||"");
 if(n.includes("카이가쿠")) return "kaigaku";
 if(n.includes("도우마")) return "douma";
 if(n.includes("코쿠시보")) return "kokushibo";
 if(n.includes("무잔") && n.includes("각성")) return "muzanAwakened";
 if(n.includes("무잔")) return "muzan";
 if(n.includes("쿄우가이")) return "kyogai";
 if(n.includes("루이")) return "rui";
 if(n.includes("최종 선별")||n.includes("손오니")) return "hand";
 if(n.includes("엔무")) return "enmu";
 if(n.includes("아카자")) return "akaza2";
 if(n.includes("다키")) return "daki";
 if(n.includes("규타로")) return "gyutaro";
 if(n.includes("굣코")) return "gyokko";
 if(n.includes("한텐구")) return "hantengu";
 if(n.includes("우로기")) return "urogi";
 if(n.includes("세키도")) return "sekido";
 if(n.includes("아이제츠")) return "aizetsu";
 if(n.includes("카라쿠")) return "karaku";
 if(n.includes("조하쿠텐")) return "zohakuten";
 return "basic";
}

function showChars(){document.getElementById("start").style.display="none";document.getElementById("select").style.display="flex";renderChars()}
function renderChars(){document.getElementById("chars").innerHTML=Object.entries(chars).map(([id,c])=>{let src=CHAR_PHOTOS[id]||(id==="tanjiro"?TANJIRO_PHOTO:null),b=breathInfo(id),ss=skillNames(id);return `<button class="char ${id===selected?"sel":""}" onclick="sel('${id}')"><div class="portrait">${src?`<img src="${src}" alt="${c.n}">`:c.e}</div><b>${c.n}</b><small>${b.name} · 일륜도 ${b.sword}</small><br><small style="color:${b.color}">${ss[0]}</small></button>`}).join("")}
function sel(id){selected=id;renderChars()}
function startGame(){let c=chars[selected];p={x:360,y:430,r:19,hp:c.hp,max:c.hp,sp:c.hp<110?105:100,maxsp:c.hp<110?105:100,a:c.a,s:c.s,c:c.c,dx:0,dy:1,inv:0,dash:0};started=true;breathingUnlocked=false;document.getElementById("select").style.display="none";build();setQuest(0);dialogue("우로코다키",["잘 왔다.","오늘부터 너의 이야기가 시작된다.","먼저 내게 와라. 호흡을 배우기 위한 첫 훈련을 시작하자."],()=>{breathingUnlocked=true;setQuest(1);toast("호흡을 배웠습니다! 이제 호흡 기술을 사용할 수 있습니다.");})}

let currentChapter=0, unlockedChapter=0;
function setQuest(q){
 quest=q;
 if(q===8){
   quest=8;
   const wasUnlocked=unlockedChapter;
   unlockedChapter=Math.max(unlockedChapter, currentChapter+1);
   if(unlockedChapter!==wasUnlocked || !document.getElementById("chapterPanel").style.display || document.getElementById("chapterPanel").style.display!=="block") showChapterComplete();
 }
 updateUI(); draw();
}
function finishChapterNow(){
 if(quest===8)return;
 quest=8;
 unlockedChapter=Math.max(unlockedChapter,currentChapter+1);
 showChapterComplete();
 updateUI();
 draw();
}
function dialogue(who,lines,done){dialog={who,lines,done};di=0;document.getElementById("who").textContent=who;document.getElementById("dtext").textContent=lines[0];document.getElementById("dialog").style.display="block"}
function nextDialog(){if(!dialog)return;di++;if(di>=dialog.lines.length){let f=dialog.done;dialog=null;document.getElementById("dialog").style.display="none";if(f)f()}else document.getElementById("dtext").textContent=dialog.lines[di]}

 else if(currentChapter===1){

 }

 else {

function drawAnimeAtmosphere(){
 const t=Date.now()/1000, W2=world.w, H2=world.h;
 ctx.save();
 let sky=ctx.createLinearGradient(0,0,0,720);
 if(currentChapter<=7){sky.addColorStop(0,"#1a2941");sky.addColorStop(.55,"#48505e");sky.addColorStop(1,"#15251f");}
 else {sky.addColorStop(0,"#080a17");sky.addColorStop(.55,"#251733");sky.addColorStop(1,"#0b0d18");}
 ctx.globalAlpha=.28;ctx.fillStyle=sky;ctx.fillRect(0,0,W2,720);
 const night=currentChapter!==0 && currentChapter!==7;
 ctx.globalAlpha=.20;ctx.fillStyle=night?"#dfe7ff":"#f7d77c";
 ctx.beginPath();ctx.arc(2050,190,78+Math.sin(t*.6)*2,0,Math.PI*2);ctx.fill();
 ctx.globalAlpha=.07;ctx.beginPath();ctx.arc(2050,190,122,0,Math.PI*2);ctx.fill();
 ctx.globalAlpha=.10;ctx.strokeStyle="#f4e8d2";ctx.lineWidth=18;ctx.lineCap="round";
 for(let j=0;j<6;j++){const y=150+j*95+Math.sin(t*.18+j)*10;ctx.beginPath();ctx.moveTo(-100,y);ctx.bezierCurveTo(400,y-45,700,y+45,1120,y);ctx.bezierCurveTo(1480,y-50,1900,y+45,2700,y-5);ctx.stroke();}
 ctx.globalAlpha=.06;ctx.strokeStyle="#fff";ctx.lineWidth=2;
 for(let i=0;i<18;i++){const y=260+i*78+(t*12)%78;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W2,y-18);ctx.stroke();}
 ctx.globalAlpha=.16;ctx.fillStyle=currentChapter===6?"#c8f2df":"#f7d58a";
 for(let i=0;i<45;i++){const x=(i*173+t*18*(i%3+1))%W2,y=(i*97+t*7*(i%4+1))%H2,r=1.2+(i%3)*.8;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
 const vg=ctx.createRadialGradient(W2/2,H2/2,300,W2/2,H2/2,1500);
 ctx.globalAlpha=.38;ctx.fillStyle=vg;ctx.fillRect(0,0,W2,H2);
 ctx.restore();
}
